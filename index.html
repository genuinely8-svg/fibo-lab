<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="theme.js?v=20261006222042"></script>
<title>Artha</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --text:#1b1f24; --muted:#6b7280; --line:#e5e7eb;
    --up:#d6453d; --down:#2f6fdb; --warn:#b45309;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#0f1115; --card:#181b21; --text:#e8eaed; --muted:#9aa1ab; --line:#2a2f37;
           --up:#f0625a; --down:#5b93f0; --warn:#f59e0b; }
  }
  :root[data-theme="dark"]{ --bg:#0f1115; --card:#181b21; --text:#e8eaed; --muted:#9aa1ab; --line:#2a2f37;
           --up:#f0625a; --down:#5b93f0; --warn:#f59e0b; }
  /* 모드 색: LONG = 초록, SHORT = 빨강 (버튼·표 머리글·요약줄·진입 뱃지·차트 선이 모두 --accent 를 씀) */
  :root{ --accent:#16a34a; --pos:#16a34a; --neg:#dc2626 }
  :root[data-dir="short"]{ --accent:#dc2626 }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --accent:#22c55e; --pos:#22c55e; --neg:#f0625a }
    :root:not([data-theme="light"])[data-dir="short"]{ --accent:#ef4444 }
  }
  :root[data-theme="dark"]{ --accent:#22c55e; --pos:#22c55e; --neg:#f0625a }
  :root[data-theme="dark"][data-dir="short"]{ --accent:#ef4444 }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;font-size:14px}
  .wrap{max-width:1320px;margin:0 auto;padding:20px 16px 60px}   /* 표가 넓어서 조금 넓게 */
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 18px;line-height:1.5}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
  .controls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:end}
  label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
  select,input{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)}
  input[type=number]{width:80px}
  #coins{width:min(420px,100%)}
  button{font:inherit;padding:8px 16px;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer;font-weight:600}
  button:disabled{opacity:.5;cursor:wait}
  #status{color:var(--muted);font-size:12px;margin-top:10px;min-height:1em}
  .tablewrap{overflow-x:auto}
  table{border-collapse:collapse;width:100%}
  th,td{padding:9px 7px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
  /* PC 최적화: 칸 제목은 두 줄까지 허용, ±오차는 숫자 아래 작은 글씨로 → 표 폭을 줄여 좁은 화면에서도 안 잘리게 */
  thead th{white-space:normal;line-height:1.25;vertical-align:bottom;min-width:48px}
  td{font-variant-numeric:tabular-nums}
  th{font-size:12px;color:var(--muted);font-weight:600}
  thead th{border-bottom:2px solid var(--accent)}
  th.mv{color:var(--accent)}
  .ev-pos{color:var(--pos);font-weight:600} .ev-neg{color:var(--neg);font-weight:600}
  /* 과거 터치 15회 미만 = 표본 부족 → 흐리게 */
  tbody tr.lowsample > td{opacity:.5}
  .modetag{font-weight:700;color:var(--accent)}
  @media (max-width:1000px){ .err{display:none} }   /* 좁은 화면에서는 ±표준편차 숨김 */
  th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:color-mix(in srgb,var(--accent) 8%,transparent)}
  tbody tr.sel{background:color-mix(in srgb,var(--accent) 14%,transparent)}
  .name{color:var(--text);text-decoration:none;font-weight:600}
  .name:hover{text-decoration:underline}
  .name small{display:none}   /* BTCUSDT 같은 뒷부분은 표에서는 생략 (폭 절약) */
  .name{display:inline-flex;align-items:center;gap:8px}
  .name img,.name .ph{width:22px;height:22px;border-radius:50%;flex:none;background:var(--bg)}
  .name .ph{display:inline-grid;place-items:center;font-size:10px;color:var(--muted);border:1px solid var(--line);font-weight:400}
  .name .go{font-size:11px;color:var(--accent);font-weight:600;margin-left:4px}
  .err{display:block;color:var(--muted);font-size:10.5px;line-height:1.1;margin-top:1px}
  .badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600}
  .b-near{background:color-mix(in srgb,var(--up) 15%,transparent);color:var(--up)}
  .b-under{background:color-mix(in srgb,var(--muted) 20%,transparent);color:var(--text)}
  .b-hit{background:var(--accent);color:#fff}
  .b-reb{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
  .b-out{background:transparent;color:var(--up);border:1px solid color-mix(in srgb,var(--up) 60%,transparent)}
  .b-done{background:color-mix(in srgb,var(--muted) 18%,transparent);color:var(--muted)}
  .since{display:block;color:var(--muted);font-size:10.5px;line-height:1.2;margin-top:2px;font-weight:400}
  .b-wait{background:color-mix(in srgb,var(--down) 12%,transparent);color:var(--down)}
  .b-none{color:var(--muted)}
  .up{color:var(--up)} .down{color:var(--down)}
  .few{color:var(--warn)}
  #chartTitle{margin:0 0 8px;font-size:15px}
  [hidden]{display:none!important}   /* hidden 속성이 display:flex 에 덮이지 않게 */
  #chart{width:100%;height:440px}
  #tv{width:100%;height:560px}
  .chead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
  .chead h2{margin:0}
  .tabs{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:2px}
  .tabs button{background:transparent;color:var(--muted);padding:6px 12px;font-weight:600}
  .tabs button.on{background:var(--card);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.15)}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
  .legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:5px}
  details{color:var(--muted);line-height:1.7}
  /* 자동 스캔 / 관심목록 */
  .modebar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
  .seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:2px}
  .seg button{background:transparent;color:var(--muted);padding:7px 14px;border-radius:6px}
  .seg button.on{background:var(--accent);color:#fff}
  .inl{flex-direction:row;align-items:center;gap:6px}
  #watchBox{display:flex;flex-wrap:wrap;align-items:center;gap:8px;flex:1;min-width:260px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:4px 6px 4px 8px;border:1px solid var(--line);border-radius:99px;background:var(--bg);font-weight:600;font-size:13px}
  .chip img,.chip .ph{width:18px;height:18px;border-radius:50%}
  .chip .ph{display:inline-grid;place-items:center;font-size:9px;color:var(--muted);border:1px solid var(--line)}
  .chip button{background:none;color:var(--muted);padding:0 4px;font-size:15px;line-height:1}
  .chip button:hover{color:var(--up)}
  .ac{position:relative}
  #acInput{width:220px}
  .aclist{position:absolute;z-index:20;top:calc(100% + 4px);left:0;width:300px;max-height:320px;overflow:auto;background:var(--card);
          border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
  .aclist div{display:flex;align-items:center;gap:8px;padding:8px 10px;cursor:pointer}
  .aclist div.on,.aclist div:hover{background:color-mix(in srgb,var(--accent) 14%,transparent)}
  .aclist img,.aclist .ph{width:20px;height:20px;border-radius:50%;flex:none}
  .aclist .ph{display:inline-grid;place-items:center;font-size:9px;color:var(--muted);border:1px solid var(--line)}
  .aclist small{color:var(--muted);margin-left:auto;font-size:11px}
  .ghost{background:var(--bg);color:var(--text);border:1px solid var(--line);padding:7px 12px}
  #sharedNote{font-size:12px;color:var(--warn)}
  #sharedNote button{padding:4px 10px;font-size:12px;margin-left:6px}
  .summary{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin:0 0 10px}
  .summary b{font-size:15px}
  td.rk{color:var(--muted);width:32px}
  /* 코인 누르면 펼쳐지는 차트 줄 */
  tbody tr[data-m] .caret{display:inline-block;color:var(--muted);font-size:11px;transition:transform .15s;margin-left:2px}
  tbody tr.open .caret{transform:rotate(180deg);color:var(--accent)}
  tbody tr.open{background:color-mix(in srgb,var(--accent) 14%,transparent)}
  tr.exp > td{padding:12px 10px 16px;background:color-mix(in srgb,var(--accent) 5%,transparent);white-space:normal;text-align:left}
  tr.exp:hover{background:transparent}
  #chartPanel #chart{height:420px}
  /* 트레이딩뷰 탭: 트레이딩뷰 공식 아이콘 (트레이딩뷰 서버의 파일을 그대로 씀) */
  .tvlogo{width:16px;height:16px;border-radius:4px;vertical-align:-3px;margin-right:6px}
  #closeChart{margin-left:8px;padding:6px 12px;font-size:13px}
  .chead{flex-wrap:nowrap} .chead h2{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* 펼친 차트는 표가 옆으로 넓어도 보이는 영역 폭에 맞춰서 (접기 버튼이 안 잘리게) */
  #chartPanel{position:sticky;left:0}
  .ncell{display:flex;align-items:center}
  /* more 버튼: 상세 페이지로 */
  a.more{display:inline-block;margin-left:8px;padding:3px 10px;border-radius:99px;background:var(--accent);color:#fff;
         font-size:12px;font-weight:700;text-decoration:none;letter-spacing:.2px;vertical-align:middle}
  a.more:hover{filter:brightness(1.12)}
  .mc,.tf{font-size:11px;font-weight:600;padding:1px 6px;border-radius:99px;margin-left:6px;white-space:nowrap}
  .mc{color:var(--muted);background:var(--bg);border:1px solid var(--line)}
  .tf{color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent)}
  summary{cursor:pointer;color:var(--text);font-weight:600}
  /* 실시간 가격 */
  .sumrow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
  .sumrow .summary{flex:1;min-width:0}
  .live{font-size:12px;color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
  .live i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
  .live.on i{background:#22c55e;box-shadow:0 0 0 3px color-mix(in srgb,#22c55e 25%,transparent)}
  .live.on b{color:#22c55e}
  .live.wait i{background:var(--warn);animation:blink 1s infinite}
  .live.wait b{color:var(--warn)}
  @keyframes blink{50%{opacity:.25}}
  .fu{animation:fu .9s ease-out} .fd{animation:fd .9s ease-out}
  @keyframes fu{0%{background:color-mix(in srgb,var(--up) 35%,transparent);color:var(--up)}100%{background:transparent}}
  @keyframes fd{0%{background:color-mix(in srgb,var(--down) 35%,transparent);color:var(--down)}100%{background:transparent}}
  span.fu,span.fd{border-radius:4px}
  /* ─────────── 휴대폰 화면 (가로 700px 이하) ─────────── */
  .setbar,#cards{display:none}
  @media (max-width:700px){
    .wrap{padding:14px 12px 50px}
    h1{font-size:20px}
    .sub{font-size:12.5px;margin-bottom:10px}
    /* 설정: 한 줄로 접기 */
    .setbar{display:flex;align-items:center;gap:8px;width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);
            padding:10px 12px;border-radius:10px;font-weight:700;text-align:left}
    .setbar .setsum{flex:1;min-width:0;font-weight:500;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .setbar .chev{color:var(--muted);transition:transform .15s}
    #setCard:not(.collapsed) .setbar .chev{transform:rotate(180deg)}
    #setCard.collapsed .controls{display:none}
    #setCard.collapsed #scanOpts{display:none!important}
    #setCard .controls{margin-top:12px}
    .controls label{flex:1 1 calc(50% - 16px)}
    .controls select,.controls input{width:100%}
    #run{width:100%}
    .modebar{margin-top:10px;padding-top:10px}
    #setCard.collapsed .modebar{border-top:0;padding-top:0}
    #mode,#dir{width:100%} #mode button,#dir button{flex:1}
    #dir{order:-1;flex:1 1 100%}       /* LONG/SHORT 는 접힌 상태에서도 첫 줄에 */
    .ccard.lowsample{opacity:.6}
    .ccard .cdet{grid-template-columns:1fr 1fr!important}
    #acInput{width:100%} .ac{flex:1}
    /* 표 대신 카드 */
    .tablewrap > table{display:none}
    #cards{display:block}
    .summary{font-size:12.5px;gap:4px 12px}
    .card.tablewrap{padding:12px 10px}
    .ccard{border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px;background:var(--bg);cursor:pointer}
    .ccard.open{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--bg))}
    .ccard .c1{display:flex;align-items:center;gap:6px}
    .ccard .c1 .rk{color:var(--muted);font-size:12px;width:18px}
    .ccard .c1 img,.ccard .c1 .ph{width:22px;height:22px;border-radius:50%;flex:none}
    .ccard .c1 .ph{display:inline-grid;place-items:center;font-size:9px;color:var(--muted);border:1px solid var(--line)}
    .ccard .c1 b{font-size:15px}
    .ccard .c1 .badge{margin-left:auto}
    .ccard .c2{margin:7px 0 0 24px;font-size:13.5px;font-variant-numeric:tabular-nums}
    .ccard .c2 .arrow{color:var(--muted);margin:0 4px}
    .ccard .c2 .dist{font-weight:700;margin-left:4px}
    .ccard .c3{display:flex;align-items:center;gap:6px;margin:5px 0 0 24px;font-size:12.5px;color:var(--muted)}
    .ccard .c3 a.more{margin-left:auto}
    .ccard .cdet{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:10px 0 0;padding-top:10px;border-top:1px dashed var(--line);font-size:12px}
    .ccard .cdet div{background:var(--card);border-radius:8px;padding:7px 8px}
    .ccard .cdet span{display:block;color:var(--muted);font-size:11px;margin-bottom:2px}
    .ccard .cchart{margin-top:10px;cursor:default}
    .muted-c{color:var(--muted);text-align:center;padding:20px 0}
    /* 차트 */
    #chartPanel{position:static}
    #chartPanel #chart{height:320px}
    .chead{flex-wrap:wrap} .chead h2{font-size:13px;flex-basis:100%}
    .tabs button{padding:5px 9px;font-size:12px}
    .legend{font-size:11px;gap:4px 10px}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1 class="brand">Artha</h1>
  <nav id="nav"></nav>

  <div class="card collapsed" id="setCard">
    <!-- 휴대폰에서만 보이는 한 줄 요약: 누르면 설정이 펼쳐짐 -->
    <button class="setbar" id="setBar" type="button"><span>⚙ 설정</span><span class="setsum" id="setSum"></span><span class="chev">▾</span></button>
    <div class="controls">
      <label>거래소
        <select id="ex">
          <option value="binance">바이낸스 현물</option>
          <option value="futures" selected>바이낸스 선물</option>
        </select>
      </label>
      <label>봉 단위
        <select id="unit">
          <option value="240">4시간</option>
          <option value="120">2시간</option>
          <option value="60" selected>1시간</option>
          <option value="30">30분</option>
          <option value="15">15분</option>
        </select>
      </label>
      <label>스윙 민감도 (좌우 봉 수)
        <input id="n" type="number" min="2" max="30" value="5">
      </label>
      <label>터치 후 관찰 봉 수
        <input id="k" type="number" min="3" max="100" value="20">
      </label>
      <label>진입 깊이
        <select id="ratio">
          <option value="0.5">A · 얕게 (신호 많음)</option>
          <option value="0.618">B · 중간</option>
          <option value="1" selected>C · 깊게 (기본)</option>
        </select>
      </label>
      <label>분석할 캔들 수
        <select id="count">
          <option value="600">600개</option>
          <option value="1000">1000개</option>
          <option value="2000" selected>2000개</option>
        </select>
      </label>
      <label>진입가 재계산 (가격은 실시간)
        <select id="auto">
          <option value="close" selected>봉 마감 시</option>
          <option value="0">끔</option>
          <option value="60">1분</option>
          <option value="300">5분</option>
        </select>
      </label>
      <label>왕복 수수료 (%)
        <input id="fee" type="number" min="0" max="5" step="0.01" value="0.1">
      </label>
      <label>정렬
        <select id="sort">
          <option value="dist" selected>진입 가격에 가까운 순</option>
          <option value="ev">기대값 높은 순</option>
        </select>
      </label>
      <button id="run">분석하기</button>
    </div>

    <div class="modebar">
      <span class="seg" id="dir">
        <button data-v="long" class="on">LONG</button>
        <button data-v="short">SHORT</button>
      </span>
      <span class="seg" id="mode">
        <button data-v="scan" class="on">자동 스캔</button>
        <button data-v="watch">관심목록</button>
      </span>
      <span id="scanOpts" style="display:contents">
        <label class="inl">시총
          <select id="mcap">
            <option value="100">100위까지</option>
            <option value="150" selected>150위까지</option>
            <option value="300">300위까지</option>
            <option value="0">전체</option>
          </select>
        </label>
        <label class="inl">거래량 상위
          <select id="topN">
            <option value="30">30개</option>
            <option value="50" selected>50개</option>
            <option value="100">100개</option>
          </select>
        </label>
      </span>
      <div id="watchBox" hidden>
        <div class="chips" id="chips"></div>
        <div class="ac">
          <input id="acInput" placeholder="코인 검색해서 추가 (예: 비트, SOL)" autocomplete="off">
          <div class="aclist" id="acList" hidden></div>
        </div>
        <button class="ghost" id="shareBtn">목록 링크 복사</button>
        <span id="sharedNote" hidden>공유받은 목록이에요<button id="saveShared">내 관심목록으로 저장</button></span>
      </div>
    </div>
    <div id="status"></div>
  </div>

  <div class="card tablewrap">
    <div class="sumrow"><div class="summary notranslate" id="summary" translate="no"></div><span class="live notranslate" id="live" translate="no"><i></i><b>실시간 준비 중</b></span></div>
    <table>
      <thead><tr>
        <th style="text-align:left">#</th><th>코인</th><th>현재가</th><th>진입 가격</th><th>진입까지 거리</th><th>상태</th>

<script>
"use strict";
// ── 거래소 설정 ─────────────────────────────────────────────────
// 바이낸스는 브라우저에서 직접 요청 (서버 필요 없음)
const EX = {
  // 바이낸스는 브라우저 직접 요청을 허용하고 제한도 넉넉해서 서버를 거치지 않음
  binance: { name: "바이낸스 현물", cur: "USDT", base: "https://api.binance.com/api/v3" },
  futures: { name: "바이낸스 선물", cur: "USDT", base: "https://fapi.binance.com/fapi/v1" },
};
const BINANCE_INTERVAL = { 240: "4h", 120: "2h", 60: "1h", 30: "30m", 15: "15m" };
const $ = id => document.getElementById(id);
const KO = (window.ARTHA_LANG || "ko") === "ko";   // 한국어가 아니면 자주 바뀌는 표·카드는 영어로 직접 쓰고 구글 번역에서 제외 (번역이 따라가며 움찔거림)
const NT = KO ? "" : ' translate="no"';           // 표 줄·카드에 붙이는 "번역하지 마" 표시
const sleep = ms => new Promise(r => setTimeout(r, ms));
let results = [];          // 코인별 분석 결과
let openCoin = null;       // 차트가 펼쳐져 있는 코인 (없으면 null)
let timer = null;
let curEx = "futures";       // 지금 표에 나온 결과의 거래소

// ── 요청 (429 너무 많은 요청이면 잠깐 쉬고 다시) ─────────────────────
async function getJSON(url, tries = 4) {
  const direct = url.startsWith("http");            // 거래소에 직접 요청하는 중인지
  let last = "";
  for (let i = 0; i < tries; i++) {
    let res;
    try { res = await fetch(url); }
    catch (e) {
      // 요청 자체가 실패: 서버가 꺼졌거나 인터넷 문제
      if (!direct) throw new Error("내 컴퓨터 서버에 연결이 안 돼요. 까만 창(start.bat)이 켜져 있는지 확인하세요");
      last = "거래소에 연결이 안 돼요 (인터넷 또는 요청 제한)";
      await sleep(2000); continue;
    }
    if (res.status === 429 || res.status === 418) {
      last = `요청 제한에 걸렸어요 (${res.status}). 1~2분 뒤 다시 눌러주세요`;
      $("status").textContent += " · 거래소가 잠깐 멈추래요, 기다리는 중…";
      await sleep(8000); continue;
    }
    if (res.status === 400) throw new Error("이 거래소에 없는 코인이에요");
    if (!res.ok) throw new Error("거래소 응답 오류 " + res.status);
    return res.json();
  }
  throw new Error(last || "알 수 없는 오류");
}

// 바이낸스: 한 번에 최대 1000개(현물) / 1500개(선물), 과거→최신 순서로 줌
async function binanceCandles(ex, coin, unit, count) {
  let all = [], end = "";
  const limit = Math.min(count, 1000);
  while (all.length < count) {
    const url = `${EX[ex].base}/klines?symbol=${coin}USDT&interval=${BINANCE_INTERVAL[unit]}&limit=${limit}` + (end ? `&endTime=${end}` : "");
    const rows = await getJSON(url);
    if (!rows.length) break;
    all = rows.concat(all);
    end = rows[0][0] - 1;                 // 가장 오래된 봉 바로 전까지 다음 페이지
    if (rows.length < limit) break;
  }
  // 바이낸스 캔들 = [시작시각, 시가, 고가, 저가, 종가, ...] (숫자가 글자로 옴)
  return all.slice(-count).map(r => ({ t: r[0], o: +r[1], h: +r[2], l: +r[3], c: +r[4] }));
}

function fetchCandles(ex, coin, unit, count) {
  return binanceCandles(ex, coin, unit, count);
}

// ── 캔들 저장소: 이미 받은 캔들은 기억해두고, 다음엔 새 캔들만 받아서 이어붙임 ──
// 첫 분석: 2000개 전부 받음 (2번 요청)
// 그 다음부터: 최신 200개만 받음 (1번 요청) → 자동 새로고침해도 요청 제한에 안 걸림
const store = new Map();
async function getCandles(ex, coin, unit, count) {
  const key = `${ex}|${coin}|${unit}`;
  const old = store.get(key);
  let candles = null;
  if (old && old.length >= count) {
    const fresh = await fetchCandles(ex, coin, unit, 200);
    // 새로 받은 것의 첫 봉이 기존 데이터 안에 있으면(빈틈이 없으면) 이어붙임
    if (fresh.length && fresh[0].t <= old[old.length - 1].t) {
      candles = old.filter(c => c.t < fresh[0].t).concat(fresh);
    }
  }
  if (!candles) candles = await fetchCandles(ex, coin, unit, count);   // 처음이거나 빈틈이 있으면 전부 새로
  store.set(key, candles.slice(-Math.max(count, 2000)));
  return candles.slice(-count);
}

// ── 코인 로고·이름·시가총액 순위·주식/원자재 구분 (meta.js) ──────────────
function saved(key) { try { const v = JSON.parse(localStorage.getItem(key) || "null"); if (v && Date.now() - v.at < 24 * 3600e3) return v.data; } catch (e) {} return null; }
const logosReady = CoinMeta.load();
const logoHtml = sym => CoinMeta.logo(sym)
  ? `<img src="${CoinMeta.logo(sym)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">`
  : `<span class="ph">${CoinMeta.base(sym).slice(0, 3)}</span>`;
// 티커 옆 꼬리표: 시가총액 순위(#1) 또는 주식·원자재 표시
function rankTag(sym) {
  const t = CoinMeta.typeLabel(sym);
  if (t) return `<span class="tf">${t}</span>`;
  const r = CoinMeta.rank(sym);
  if (r) return `<span class="mc">#${r}</span>`;
  return CoinMeta.hasTop() ? `<span class="mc">#1000+</span>` : "";
}

// ── 거래되는 코인 목록 (24시간 거래량 포함) ──────────────────────────
const STABLES = new Set(["USDC", "FDUSD", "TUSD", "BUSD", "USDP", "DAI", "EUR", "AEUR", "USDE", "XUSD", "BFUSD", "RLUSD", "USD1", "PYUSD", "EURI"]);
const uniCache = {};
async function universe(ex) {
  const c = uniCache[ex];
  if (c && Date.now() - c.at < 60e3) return c.list;               // 1분 안에는 다시 안 받음
  const rows = await getJSON(`${EX[ex].base}/ticker/24hr`);
  await CoinMeta.typesLoaded();                                  // 주식·원자재 구분 정보만 기다림 (meta.js)
  const dayAgo = Date.now() - 86400e3;
  const list = rows
    .filter(x => x.symbol.endsWith("USDT") && !x.symbol.includes("_") && +x.quoteVolume > 0 && x.closeTime > dayAgo)
    .map(x => ({ sym: x.symbol.slice(0, -4), vol: +x.quoteVolume, chg: +x.priceChangePercent }))
    .filter(x => !STABLES.has(x.sym) && CoinMeta.isCrypto(x.sym))   // 코인만 (금·은·원유·주식 상품은 뺌)
    .sort((a, b) => b.vol - a.vol);
  uniCache[ex] = { at: Date.now(), list };
  return list;
}

// ── 설정 기억하기 (새로고침해도 유지) ────────────────────────────────
const DEFAULT_WATCH = ["BTC", "ETH", "SOL", "XRP", "ARB", "HYPE", "UNI", "ZEC", "ONDO"];
let mode = "scan";
let dir = "long";                  // "long" | "short"
const hashDir = () => { const h = location.hash.slice(1).toLowerCase(); return h === "long" || h === "short" ? h : null; };
let watch = DEFAULT_WATCH.slice();
let shared = null;                 // 링크로 공유받은 목록 (저장 전)
const SETTINGS = ["ex", "unit", "n", "k", "ratio", "count", "auto", "topN", "mcap", "fee", "sort"];
function saveSettings() {
  const o = { mode, dir, autoV: 2 }; for (const id of SETTINGS) o[id] = $(id).value;
  try { localStorage.setItem("main-settings-v1", JSON.stringify(o)); } catch (e) {}
}
function loadSettings() {
  try {
    const o = JSON.parse(localStorage.getItem("main-settings-v1") || "null");
    if (o) { for (const id of SETTINGS) if (o[id] != null) $(id).value = o[id]; if (o.mode) mode = o.mode; if (o.dir === "long" || o.dir === "short") dir = o.dir; if (o.autoV !== 2) $("auto").value = "close"; }   // 예전에 저장된 재계산 주기는 새 기본값(봉 마감 시)으로
    const w = JSON.parse(localStorage.getItem("watch-v1") || "null");
    if (Array.isArray(w) && w.length) watch = w;
  } catch (e) {}
  const hd = hashDir(); if (hd) dir = hd;                          // 주소의 #long / #short 가 저장값보다 우선
  const q = new URLSearchParams(location.search).get("watch");      // ?watch=BTC,ETH 로 들어온 경우
  if (q) {
    shared = q.split(",").map(x => x.trim().toUpperCase().replace(/[^A-Z0-9]/g, "")).filter(Boolean).slice(0, 60);
    if (shared.length) mode = "watch"; else shared = null;
  }
}
function saveWatch() { try { localStorage.setItem("watch-v1", JSON.stringify(watch)); } catch (e) {} }
const activeWatch = () => shared || watch;


// ── 실행 ─────────────────────────────────────────────────────────
let lastSkipped = 0, running = false, again = false;
// 분석 중에 설정을 바꾸면, 지금 분석이 끝난 뒤 한 번 더 돌림 (동시에 두 번 돌지 않게)
async function run() {
  if (running) { again = true; return; }
  running = true;
  try { await runOnce(); } finally {
    running = false;
    if (again) { again = false; run(); }
  }
}
async function runOnce() {
  const ex = $("ex").value, unit = $("unit").value, n = +$("n").value, k = +$("k").value;
  const count = +$("count").value;
  $("run").disabled = true;
  lastBar = barIdx();
  let coins;
  try {
    if (mode === "scan") {
      $("status").textContent = "거래량 상위 코인 고르는 중…";
      let list = await universe(ex);
      const maxRank = +$("mcap").value;
      if (maxRank) {
        await logosReady;                                  // 시가총액 순위 (코인게코) 받을 때까지
        // 순위를 한 번도 못 받았으면 필터 없이 잡코인까지 섞이지 않게 여기서 멈춤 (표는 이전 결과 그대로)
        if (!CoinMeta.hasTop()) throw new Error("시가총액 순위(코인게코)를 아직 못 받아왔어요 (요청 제한). 몇 분 뒤 자동으로 다시 시도해요");
        list = list.filter(x => { const r = CoinMeta.rank(x.sym); return r && r <= maxRank; });   // 시총 순위 밖 잡코인 제외
      }
      coins = list.slice(0, +$("topN").value).map(x => x.sym);
    } else {
      coins = activeWatch().slice();
    }
  } catch (e) {
    $("status").textContent = e.message; $("run").disabled = false; return;   // (run()이 running을 풀어줌)
  }
  const out = new Array(coins.length);
  let done = 0, next = 0;
  // 4개씩 동시에 분석 (너무 많이 한꺼번에 보내면 요청 제한에 걸림)
  async function worker() {
    while (next < coins.length) {
      const i = next++, m = coins[i];
      try {
        const candles = await getCandles(ex, m, unit, count);
        if (candles.length < 100) throw new Error(`상장된 지 얼마 안 돼서 데이터가 부족해요 (캔들 ${candles.length}개)`);
        out[i] = { market: m, candles };
      } catch (e) {
        out[i] = { market: m, error: e.message };
      }
      done++;
      $("status").textContent = `분석 중… ${done}/${coins.length} · ${EX[ex].name}`;
    }
  }
  await Promise.all([worker(), worker(), worker(), worker()]);
  await logosReady;            // 로고가 준비될 때까지 (보통 즉시)
  // 계산은 캔들을 다 받은 뒤 "지금 모드"로 (받는 도중에 LONG/SHORT 를 바꿔도 맞게)
  for (let i = 0; i < out.length; i++) if (out[i] && !out[i].error) out[i] = { ...out[i], ...FibCore.analyze(out[i].candles, { n, k, ratio: +$("ratio").value || 1, direction: dir }) };
  // 자동 스캔에서는 데이터가 부족한 코인은 조용히 빼고 개수만 알려줌
  lastSkipped = mode === "scan" ? out.filter(r => r.error).length : 0;
  results = mode === "scan" ? out.filter(r => !r.error) : out;
  curEx = ex;
  Live.applyLatest();          // 분석하는 사이에 들어온 실시간 가격을 바로 반영
  // 차트를 펼쳐 둔 상태면 숫자만 바꿔서 트레이딩뷰가 새로고침되지 않게 (종목이 바뀌었으면 어쩔 수 없이 다시 그림)
  if (!(openCoin && refreshInPlace())) renderTable();
  Live.connect(ex, results.filter(r => !r.error).map(r => r.market));
  if (openCoin && !results.find(r => r.market === openCoin && !r.error)) { openCoin = null; renderTable(); }
  if (openCoin && view === "lw") drawChart();            // 펼쳐 둔 차트도 새 데이터로 (트레이딩뷰는 스스로 실시간 갱신)
  $("status").textContent = `마지막 갱신 ${new Date().toLocaleTimeString("ko-KR")} · ${EX[ex].name} · 봉 ${$("unit").selectedOptions[0].text} · 캔들 ${count}개 · `
    + (mode === "scan" ? (+$("mcap").value ? `시총 ${$("mcap").value}위 안에서 ` : "") + `거래량 상위 ${coins.length}개 자동 스캔` + (lastSkipped ? ` (데이터 부족 ${lastSkipped}개 제외)` : "") : `관심목록 ${coins.length}개`)
    + (CoinMeta.staleHours() ? ` · 시총 순위는 ${CoinMeta.staleHours()}시간 전 저장값 (코인게코 요청 제한)` : "");
  $("run").disabled = false;
}

// ── 표 ───────────────────────────────────────────────────────────
// 가격 표시: 원화는 정수, 달러는 소수점까지
const won = v => {
  if (v == null) return "-";
  return "$" + (v >= 1000 ? v.toLocaleString("en-US", { maximumFractionDigits: 1 })
                          : v.toLocaleString("en-US", { maximumSignificantDigits: 5 }));
};
const pct = v => v == null ? "-" : v.toFixed(2) + "%";
const err = v => v == null ? "" : ` <span class="err">±${v.toFixed(2)}</span>`;

function badge(cur) {
  const l = FibCore.label(cur);
  const cls = { "진입 구간": "b-hit", "진입 근접": "b-near", "이탈": "b-out", "대기": "b-wait" }[l];
  const txt = KO ? l : ({ "진입 구간": "In zone", "진입 근접": "Near entry", "이탈": "Broken", "대기": "Waiting" }[l] || l);
  return `<span class="badge ${cls}">${txt}</span>`;
}

// 순위: ① 진입 구간 → ② 진입 근접 → ③ 이탈 → ④ 대기 (진입가에 가까운 순, 진입가 없는 건 맨 뒤) → ⑤ 오류
function rankKey(r) {
  if (r.error) return 4e9;
  const c = r.current, l = FibCore.label(c);
  const d = c?.level ? c.distance : 1e5;
  return { "진입 구간": 0, "진입 근접": 1e6, "이탈": 2e6, "대기": 3e6 }[l] + d;
}
const feeVal = () => { const v = parseFloat($("fee").value); return isFinite(v) && v >= 0 ? v : 0.1; };
const evOf = r => r.error ? null : FibCore.expectancy(r.stats, feeVal());
const LOW_N = 15, LOW_TIP = "표본 부족 (과거 터치 15회 미만)", ROW_TIP = "누르면 차트가 펼쳐져요";
const isLow = r => !r.error && r.stats.count < LOW_N;
function sortedRows() {
  if ($("sort").value !== "ev") return [...results].sort((a, b) => rankKey(a) - rankKey(b));
  return [...results].sort((a, b) => {                    // 기대값 높은 순 (계산 못 하는 건 뒤로)
    const x = evOf(a), y = evOf(b);
    if (x == null || y == null) return x == null && y == null ? rankKey(a) - rankKey(b) : x == null ? 1 : -1;
    return (y - x) || rankKey(a) - rankKey(b);
  });
}
function evHtml(r, withTd) {
  const ev = evOf(r);
  const cls = ev == null ? "" : ev > 0 ? "ev-pos" : ev < 0 ? "ev-neg" : "";
  const txt = ev == null ? "-" : (ev > 0 ? "+" : "") + ev.toFixed(2) + "%";
  return withTd ? `<td class="ev ${cls}">${txt}</td>` : `<span class="ev ${cls}">${txt}</span>`;
}

// 요약줄·실시간 표시는 자주 바뀌어서 구글 번역이 따라가다 깜빡임 → 한국어가 아니면 영어로 직접 쓰고 번역에서 제외
let lastSummary = "";
if (!KO) $("live").querySelector("b").textContent = "Getting ready";
function renderSummary() {
  const ok = results.filter(r => !r.error && r.current?.level);
  const cnt = l => ok.filter(r => FibCore.label(r.current) === l).length;
  const ev = $("sort").value === "ev";
  const html = KO
    ? `<span class="modetag">${dir.toUpperCase()} 모드 ·</span><span>분석 <b>${results.length}</b>개</span>
    <span>진입 구간 <b style="color:var(--accent)">${cnt("진입 구간")}</b>개</span>
    <span>진입 근접(5% 이내) <b class="up">${cnt("진입 근접")}</b>개</span>
    <span>이탈 <b class="up">${cnt("이탈")}</b>개</span>
    <span style="color:var(--muted)">${ev ? "기대값 높은 순서" : "진입 가격에 가까운 순서"}</span>`
    : `<span class="modetag">${dir.toUpperCase()} mode ·</span><span>Scanned <b>${results.length}</b></span>
    <span>In entry zone <b style="color:var(--accent)">${cnt("진입 구간")}</b></span>
    <span>Near entry (within 5%) <b class="up">${cnt("진입 근접")}</b></span>
    <span>Broken <b class="up">${cnt("이탈")}</b></span>

  if (html !== lastSummary) { $("summary").innerHTML = html; lastSummary = html; }   // 숫자가 그대로면 다시 그리지 않음
}
let shownOrder = "";     // 지금 화면에 보이는 코인 순서 (실시간 정렬 때 바뀌었는지 비교용)
let shownSet = "";       // 지금 화면에 보이는 코인 묶음 (순서 무시, 재분석 때 종목이 바뀌었는지 비교용)
const setKey = rows => rows.map(r => r.market + (r.error ? "!" : "")).sort().join(",");
// 표 한 줄의 칸들 (표를 새로 그릴 때와 숫자만 바꿀 때 같이 씀)
function rowTds(r, rank, name) {
  const s = r.stats, c = r.current;
  const few = s.count < 5 ? "few" : "";
  return `<td class="rk">${rank}</td>
      <td>${name}</td>
      <td class="px">${won(r.price)}</td>
      <td class="lv">${won(c?.level)}</td>
      <td class="ds${c?.level && c.distance < 0 ? " up" : ""}">${pct(c?.distance)}</td>
      <td class="st">${badge(c)}</td>
      <td class="${few}">${s.count}${KO ? "회" : "x"}</td>
      <td class="up">${pct(s.reboundAvg)}${err(s.reboundErr)}</td>
      <td class="down">${pct(s.fallAvg)}${err(s.fallErr)}</td>
      <td>${pct(s.winRate)}</td>
      <td class="xp">${won(c?.expected)}</td>
      ${evHtml(r, true)}`;
}
// 재분석 결과를 표에 반영할 때, 종목이 그대로면 표를 다시 그리지 않고 숫자만 바꿈
// → 펼쳐 둔 차트 묶음을 옮기지 않으니 트레이딩뷰(iframe)가 새로고침되지 않음
// (순서는 그대로 둠: 차트를 펼쳐 보는 중엔 원래도 줄이 안 움직임. 접으면 다시 정렬됨)
function refreshInPlace() {
  if (setKey(results) !== shownSet) return false;
  renderSummary();
  for (const r of results) {
    if (r.error) continue;
    const tr = $("tbody").querySelector(`tr[data-m="${r.market}"]`);
    if (tr) {
      tr.innerHTML = rowTds(r, tr.querySelector(".rk").textContent, tr.children[1].innerHTML);
      tr.classList.toggle("lowsample", isLow(r)); tr.title = isLow(r) ? LOW_TIP : ROW_TIP;
    }
    const card = $("cards").querySelector(`.ccard[data-m="${r.market}"]`);
    if (card) {
      const p = cardParts(r);
      card.classList.toggle("lowsample", isLow(r)); card.title = isLow(r) ? LOW_TIP : "";
      card.querySelector(".st").innerHTML = p.st;
      card.querySelector(".c2").innerHTML = p.c2;
      card.querySelector(".c3").innerHTML = p.c3;
      const det = card.querySelector(".cdet"); if (det) det.innerHTML = p.cdet;
    }
  }
  if (openCoin) fitPanel();
  return true;
}
const chartPanel = $("chartPanel");      // 차트 묶음 (표를 다시 그려도 지워지지 않게 따로 잡아둠)
function renderTable() {
  $("chartHolder").appendChild(chartPanel);   // 표를 새로 그리기 전에 차트 묶음을 안전한 곳으로 옮김
  const rows = sortedRows();
  shownOrder = rows.map(r => r.market).join(",");
  shownSet = setKey(rows);
  renderSummary();
  let rank = 0;
  $("tbody").innerHTML = rows.map(r => {
    // 코인 이름을 누르면 바로 아래 차트가 펼쳐지고, more 를 누르면 상세 페이지로 (지금 설정 그대로 넘김)
    const href = `coin.html?s=${encodeURIComponent(r.market)}&ex=${curEx}&n=${$("n").value}&k=${$("k").value}&r=${$("ratio").value}`;
    const logo = logoHtml(r.market);
    const name = `<div class="ncell"><span class="name">${logo}<span>${r.market}<small>${r.market}USDT</small></span>${rankTag(r.market)}<span class="caret">▾</span></span>`
      + `<a class="more" href="${href}" onclick="event.stopPropagation()">more</a></div>`;
    if (r.error) return `<tr${NT}><td class="rk">-</td><td>${name}</td><td colspan="10" style="text-align:left;color:var(--muted)">${r.error}</td></tr>`;
    const row = `<tr${NT} data-m="${r.market}" class="${r.market === openCoin ? "open" : ""}${isLow(r) ? " lowsample" : ""}" title="${isLow(r) ? LOW_TIP : ROW_TIP}">${rowTds(r, ++rank, name)}</tr>`;
    // 펼친 코인이면 바로 아래에 차트 줄을 하나 더
    return r.market === openCoin ? row + `<tr class="exp"><td colspan="12" id="expCell"></td></tr>` : row;
  }).join("");
  // 차트 묶음을 펼친 줄 안으로 옮기기 (없으면 숨김 보관함으로)
  renderCards(rows);
  if (isMobile()) { if ($("expCard")) $("expCard").appendChild(chartPanel); }
  else if ($("expCell")) { $("expCell").appendChild(chartPanel); fitPanel(); }
  for (const tr of $("tbody").querySelectorAll("tr[data-m]")) {
    tr.onclick = () => toggleCoin(tr.dataset.m);
  }
}
// ── 휴대폰: 카드 목록 ────────────────────────────────────────────
const mq = matchMedia("(max-width:700px)");
const isMobile = () => mq.matches;
mq.addEventListener("change", () => { chartPanel.style.width = ""; renderTable(); if (openCoin) drawChart(); });
// 카드 한 장 안의 숫자 부분 (카드를 새로 그릴 때와 숫자만 바꿀 때 같이 씀)
function cardParts(r) {
  const s = r.stats, c = r.current;
  const href = `coin.html?s=${encodeURIComponent(r.market)}&ex=${curEx}&n=${$("n").value}&k=${$("k").value}&r=${$("ratio").value}`;
  const more = `<a class="more" href="${href}" onclick="event.stopPropagation()">more</a>`;
  const dist = `<span class="dist ${c?.level && c.distance <= 5 ? "up" : ""}">${c?.level ? `(${pct(c.distance)})` : ""}</span>`;
  return {
    st: badge(c),
    c2: `<span class="px">${won(r.price)}</span><span class="arrow">→</span>${KO ? "진입" : "Entry"} <span class="lv">${won(c?.level)}</span>${dist}`,
    c3: `${LB().avg} <span class="up">${pct(s.reboundAvg)}</span> · ${KO ? "터치" : "Touches"} <span class="${s.count < 5 ? "few" : ""}">${s.count}${KO ? "회" : ""}</span>${more}`,
    cdet: `
          <div><span>${LB().adv}</span><b class="down">${pct(s.fallAvg)}</b></div>
          <div><span>${LB().win}</span><b>${pct(s.winRate)}</b></div>
          <div><span>${LB().exp}</span><b class="xp">${won(c?.expected)}</b></div>
          <div><span>${KO ? "기대값(참고)" : "Expected value"}</span><b>${evHtml(r, false)}</b></div>
        `,
  };
}
function renderCards(rows) {
  let rank = 0;
  $("cards").innerHTML = rows.filter(r => !r.error || mode === "watch").map(r => {
    const href = `coin.html?s=${encodeURIComponent(r.market)}&ex=${curEx}&n=${$("n").value}&k=${$("k").value}&r=${$("ratio").value}`;
    const more = `<a class="more" href="${href}" onclick="event.stopPropagation()">more</a>`;
    if (r.error) return `<div class="ccard"${NT}><div class="c1"><span class="rk">-</span>${logoHtml(r.market)}<b>${r.market}</b>${rankTag(r.market)}</div>
      <div class="c3">${r.error}${more}</div></div>`;
    const open = r.market === openCoin, p = cardParts(r);
    return `<div${NT} class="ccard${open ? " open" : ""}${isLow(r) ? " lowsample" : ""}" data-m="${r.market}"${isLow(r) ? ` title="${LOW_TIP}"` : ""}>
      <div class="c1"><span class="rk">${++rank}</span>${logoHtml(r.market)}<b>${r.market}</b>${rankTag(r.market)}<span class="st" style="margin-left:auto;text-align:right">${p.st}</span></div>
      <div class="c2">${p.c2}</div>
      <div class="c3">${p.c3}</div>
      ${open ? `<div class="cdet">${p.cdet}</div>
        <div class="cchart" id="expCard" onclick="event.stopPropagation()"></div>` : ""}
    </div>`;
  }).join("") || `<div class="muted-c">결과가 없어요</div>`;
  for (const el of $("cards").querySelectorAll(".ccard[data-m]")) el.onclick = () => toggleCoin(el.dataset.m);
}

// 펼친 차트 폭 = 표가 보이는 영역 폭 (표가 옆으로 스크롤돼도 차트는 화면 안에)
function fitPanel() {
  if (isMobile()) { chartPanel.style.width = ""; return; }
  const box = document.querySelector(".tablewrap");
  if (box && chartPanel.parentElement && chartPanel.parentElement.id === "expCell") chartPanel.style.width = (box.clientWidth - 48) + "px";
}
addEventListener("resize", fitPanel);
// 같은 코인을 다시 누르면 접고, 다른 코인을 누르면 그 코인 아래로 펼침
function toggleCoin(m) {
  openCoin = openCoin === m ? null : m;
  renderTable();
  if (openCoin) {
    drawChart();
    const tr = isMobile() ? $("cards").querySelector(`.ccard[data-m="${openCoin}"]`) : $("tbody").querySelector(`tr[data-m="${openCoin}"]`);
    if (tr) { const y = tr.getBoundingClientRect().top; if (y < 0 || y > innerHeight * 0.6) tr.scrollIntoView({ behavior: "smooth", block: "start" }); }
  }
}

// ── 차트 (chart.js) ─────────────────────────────────────────────
let view = "lw";   // "lw" = 분석 차트, "tv" = 트레이딩뷰

function tvSymbol(m) {
  if (curEx === "binance") return `BINANCE:${m}USDT`;
  return `BINANCE:${m}USDT.P`;            // .P = 무기한 선물
}

function drawChart() {
  const r = results.find(x => x.market === openCoin);
  if (!r || r.error) return;
  $("chartTitleText").textContent = `${r.market} · ${EX[curEx].name} · 과거 진입가 터치 ${r.stats.count}회`;
  if (view === "lw") FiboChart.draw($("chart"), r, { krw: false });
  else FiboChart.tradingView($("tv"), tvSymbol(r.market), $("unit").value);
}

function setView(v) {
  view = v;
  $("tabLw").classList.toggle("on", v === "lw");
  $("tabTv").classList.toggle("on", v === "tv");
  $("chart").hidden = v !== "lw";
  $("tv").hidden = v !== "tv";
  $("legend").hidden = v !== "lw";
  drawChart();
}
$("tabLw").onclick = () => setView("lw");
$("tabTv").onclick = () => setView("tv");
$("closeChart").onclick = () => { if (openCoin) toggleCoin(openCoin); };

// ── 관심목록: 칩 + 검색 자동완성 ──────────────────────────────────
function renderChips() {
  const list = activeWatch();
  $("chips").innerHTML = list.map(sym => `<span class="chip">${logoHtml(sym)}${sym}${rankTag(sym)}<button data-s="${sym}" title="빼기">×</button></span>`).join("")
    || `<span class="small" style="color:var(--muted)">아래에서 코인을 검색해서 추가하세요</span>`;
  for (const b of $("chips").querySelectorAll("button")) b.onclick = () => {
    const l = activeWatch(); l.splice(l.indexOf(b.dataset.s), 1);
    if (!shared) saveWatch();
    renderChips(); run();
  };
  $("sharedNote").hidden = !shared;
}
async function addCoins(syms) {
  // 이 거래소에서 거래되는 "코인"만 추가 (원자재·주식 상품이나 없는 기호는 빼고 알려줌)
  let ok = null;
  try { ok = new Set((await universe($("ex").value)).map(u => u.sym)); } catch (e) {}
  if (ok) {
    const bad = syms.filter(s => s && !ok.has(s));
    if (bad.length) $("status").textContent = `추가 못 한 것: ${bad.join(", ")} (이 거래소에 없거나 코인이 아닌 상품이에요)`;
    syms = syms.filter(s => ok.has(s));
  }
  const l = activeWatch();
  let added = 0;
  for (const s of syms) if (s && !l.includes(s)) { l.push(s); added++; }
  if (!added) return;
  if (!shared) saveWatch();
  renderChips(); run();
}
let acItems = [], acIdx = 0;
async function acShow() {
  const raw = $("acInput").value.trim();
  if (!raw) { $("acList").hidden = true; return; }
  let uni = [];
  try { uni = await universe($("ex").value); } catch (e) {}
  const Q = raw.toUpperCase(), lower = raw.toLowerCase(), have = new Set(activeWatch());
  const score = u => (u.sym === Q ? 0 : u.sym.startsWith(Q) ? 1 : (CoinMeta.ko(u.sym) || "").startsWith(raw) ? 2 : 3);
  acItems = uni.filter(u => !have.has(u.sym) && (u.sym.includes(Q) || (CoinMeta.ko(u.sym) || "").includes(raw) || (CoinMeta.name(u.sym) || "").toLowerCase().includes(lower)))
    .sort((a, b) => score(a) - score(b) || b.vol - a.vol).slice(0, 8);
  acIdx = 0;
  $("acList").innerHTML = acItems.map((u, i) => `<div data-i="${i}" class="${i === 0 ? "on" : ""}">${logoHtml(u.sym)}<b>${u.sym}</b>
      <span style="color:var(--muted);font-size:12px">${CoinMeta.ko(u.sym) || CoinMeta.name(u.sym) || ""}</span> ${rankTag(u.sym)}<small>${shortVol(u.vol)}</small></div>`).join("")
    || `<div style="color:var(--muted);cursor:default">${EX[$("ex").value].name}에 없는 코인이에요</div>`;
  $("acList").hidden = false;
  for (const d of $("acList").querySelectorAll("div[data-i]")) d.onmousedown = e => { e.preventDefault(); pick(+d.dataset.i); };
}
const shortVol = v => v >= 1e9 ? "$" + (v / 1e9).toFixed(1) + "B" : v >= 1e6 ? "$" + (v / 1e6).toFixed(0) + "M" : "$" + (v / 1e3).toFixed(0) + "K";
function pick(i) {
  const u = acItems[i]; if (!u) return;
  $("acInput").value = ""; $("acList").hidden = true;
  addCoins([u.sym]);
}
$("acInput").oninput = acShow;
$("acInput").onkeydown = e => {
  const items = $("acList").querySelectorAll("div[data-i]");
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault(); if (!items.length) return;
    acIdx = (acIdx + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length;
    items.forEach((d, i) => d.classList.toggle("on", i === acIdx));
  } else if (e.key === "Enter") {
    e.preventDefault();
    const raw = $("acInput").value;
    if (raw.includes(",")) {                                   // "BTC,ETH,SOL" 붙여넣기도 됨
      addCoins(raw.split(",").map(x => x.trim().toUpperCase().replace(/USDT$/, "").replace(/[^A-Z0-9]/g, "")));
      $("acInput").value = ""; $("acList").hidden = true;
    } else pick(acIdx);
  } else if (e.key === "Escape") $("acList").hidden = true;
};
$("acInput").onblur = () => setTimeout(() => $("acList").hidden = true, 150);

$("shareBtn").onclick = async () => {

};

}

// ── LONG / SHORT 전환 ────────────────────────────────────────────
const LBL = {
  long:  { avg: "평균 반등",   adv: "평균 추가하락", win: "반등 우세",   exp: "예상 반등가",   mark: "▲" },
  short: { avg: "평균 하락", adv: "평균 추가상승", win: "하락 우세", exp: "예상 하락가", mark: "▼" },
};
const LBL_EN = {
  long:  { avg: "Avg bounce", adv: "Avg further drop", win: "Bounce win rate", exp: "Expected bounce" },
  short: { avg: "Avg drop", adv: "Avg further rise", win: "Drop win rate", exp: "Expected drop" },
};
const LB = () => (KO ? LBL : LBL_EN)[dir];       // 카드 안 글자 (카드는 번역에서 빠져서 직접 영어로)
function applyDirUI() {
  const L = LBL[dir];
  document.documentElement.dataset.dir = dir;               // 모드 색(--accent)이 여기서 바뀜
  for (const b of $("dir").querySelectorAll("button")) b.classList.toggle("on", b.dataset.v === dir);
  $("thAvg").textContent = L.avg; $("thAdv").textContent = L.adv; $("thWin").textContent = L.win; $("thExp").textContent = L.exp;
  $("legExp").textContent = L.exp;
  for (const a of document.querySelectorAll("#legend .arr")) a.textContent = L.mark;
  if (location.hash.slice(1).toLowerCase() !== dir) history.replaceState(null, "", location.pathname + location.search + "#" + dir);
}
// 전환: 설정은 그대로, 캔들은 다시 받지 않고 저장된 것으로 바로 다시 계산 (실시간 웹소켓도 그대로)
function setDir(d) {
  if (d === dir) return;
  dir = d; applyDirUI(); saveSettings(); updateSetSum();
  if (!results.length) return;
  const n = +$("n").value, k = +$("k").value;
  results = results.map(r => r.error ? r : { market: r.market, candles: r.candles, ...FibCore.analyze(r.candles, { n, k, ratio: +$("ratio").value || 1, direction: dir }) });
  Live.applyLatest();
  if (!(openCoin && refreshInPlace())) renderTable();
  if (openCoin && view === "lw") drawChart();
}
for (const b of $("dir").querySelectorAll("button")) b.onclick = () => setDir(b.dataset.v);
addEventListener("hashchange", () => { const h = hashDir(); if (h) setDir(h); });

// ── 모드 전환 ────────────────────────────────────────────────────

for (const b of $("mode").querySelectorAll("button")) b.onclick = () => { if (b.dataset.v !== mode) { setMode(b.dataset.v); run(); } };

// ── 이벤트 ───────────────────────────────────────────────────────
$("run").onclick = run;
// "봉 마감 시": 선택한 봉 단위가 마감된 직후(5초 뒤)에만 재계산. 바이낸스 봉은 UTC 기준 단위 배수 시각에 열리고 닫힘
const CLOSE_DELAY = 5000;
const unitMs = () => +$("unit").value * 60000;
const barIdx = () => Math.floor(Date.now() / unitMs());
let lastBar = null;                // 마지막으로 분석을 시작했을 때의 봉 번호
function scheduleClose() {
  const u = unitMs();
  const wait = (barIdx() + 1) * u + CLOSE_DELAY - Date.now();
  timer = setTimeout(() => { if (!document.hidden) run(); scheduleClose(); }, wait);
}
function setAuto() {
  clearInterval(timer); clearTimeout(timer);
  const v = $("auto").value;
  if (v === "close") scheduleClose();
  else if (+v) timer = setInterval(() => { if (!running && !document.hidden) run(); }, +v * 1000);
}
// 화면이 꺼져 있는 동안 봉이 마감됐으면, 돌아왔을 때 한 번 재계산
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && $("auto").value === "close" && lastBar != null && lastBar !== barIdx() && Date.now() % unitMs() > CLOSE_DELAY) run();
});
// 차트 제목 옆 봉 마감 카운트다운 (1초마다). 마지막 분석 후 봉이 하나 이상 지났는데 30초 넘게 갱신이 없으면 "갱신 지연"
const STALE_GRACE = 30000;
function tickCountdown() {
  const el = $("barCd"); if (!el) return;
  const u = unitMs(), left = Math.max(0, Math.ceil(((barIdx() + 1) * u - Date.now()) / 1000));
  const h = Math.floor(left / 3600), m = String(Math.floor(left % 3600 / 60)).padStart(2, "0"), s = String(left % 60).padStart(2, "0");
  const stale = lastBar != null && barIdx() > lastBar && Date.now() % u > STALE_GRACE;
  el.innerHTML = `${KO ? "봉 마감까지" : "Candle closes in"} ${h ? h + ":" : ""}${m}:${s}` + (stale ? ` <span style="color:#e5484d;font-weight:700">${KO ? "갱신 지연" : "Update delayed"}</span>` : "");
}
setInterval(tickCountdown, 1000); tickCountdown();
$("auto").onchange = () => { setAuto(); saveSettings(); };
for (const id of ["ex", "unit", "n", "k", "ratio", "count", "topN", "mcap"]) $(id).addEventListener("change", () => { saveSettings(); updateSetSum(); if (id === "unit") setAuto(); run(); });
// 수수료·정렬은 다시 받을 필요 없이 표만 다시 그림
$("fee").addEventListener("input", () => { saveSettings(); if (results.length && !(openCoin && refreshInPlace())) renderTable(); });
$("sort").addEventListener("change", () => { saveSettings(); if (results.length) renderTable(); });

// ── 실시간 가격 (바이낸스 웹소켓) ─────────────────────────────────
// 무거운 계산(스윙·진입가·통계)은 몇 분마다, 가격은 바이낸스가 바뀔 때마다 보내주는 걸 받아서 즉시 반영
const Live = (() => {
  // 선물은 2026년 4월부터 주소가 /market 으로 바뀜 (예전 주소는 폐지)
  const URLS = {
    binance: ["wss://stream.binance.com:9443/stream?streams=", "wss://data-stream.binance.vision/stream?streams="],
    futures: ["wss://fstream.binance.com/market/stream?streams="],
  };
  let ws = null, key = "", ex = "", coins = [], urlIdx = 0, retry = 0, retryTimer = null, lastTick = 0;
  const latest = new Map();        // 코인 → 가장 최근 실시간 가격
  const pending = new Map();       // 화면에 아직 안 그린 가격 변화

  const EN_LIVE = [[/^실시간 연결됨 · 방금 수신$/, "Live · just now"], [/^실시간 연결됨 · (\d+)초 전 수신$/, "Live · $1s ago"], [/^실시간 연결됨$/, "Live"],
                   [/^실시간 연결 중…$/, "Connecting…"], [/^재연결 중… \((\d+)초 뒤\)$/, "Reconnecting in $1s…"], [/^재연결 중…$/, "Reconnecting…"],
                   [/^실시간 꺼짐$/, "Live off"], [/^실시간 준비 중$/, "Getting ready"]];
  function setStatus(kind, text) {
    const el = $("live");
    if (!KO) for (const [re, en] of EN_LIVE) if (re.test(text)) { text = text.replace(re, en); break; }
    if (el.className !== "live " + kind) el.className = "live " + kind;
    const b = el.querySelector("b");
    if (b.textContent !== text) b.textContent = text;
  }

  function connect(newEx, newCoins) {
    const k = newEx + "|" + newCoins.slice().sort().join(",");
    if (k === key && ws && ws.readyState <= 1) return;        // 같은 목록이면 그대로 유지
    if (newEx !== curLiveEx) latest.clear();
    key = k; ex = newEx; coins = newCoins; urlIdx = 0; retry = 0;
    curLiveEx = ex;
    open();
  }
  let curLiveEx = "";

  function open() {
    clearTimeout(retryTimer);
    if (ws) { ws.onclose = ws.onerror = ws.onmessage = null; try { ws.close(); } catch (e) {} ws = null; }
    if (!coins.length) { setStatus("", "실시간 꺼짐"); return; }
    const streams = coins.map(c => c.toLowerCase() + "usdt@miniTicker").join("/");
    const myKey = key;
    setStatus("wait", retry ? "재연결 중…" : "실시간 연결 중…");
    const sock = new WebSocket(URLS[ex][urlIdx % URLS[ex].length] + streams);
    ws = sock;
    let opened = false;
    sock.onopen = () => { opened = true; retry = 0; setStatus("on", "실시간 연결됨"); };
    sock.onmessage = e => {
      let m; try { m = JSON.parse(e.data); } catch (err) { return; }
      const d = m.data || m;
      if (!d || !d.s || !d.s.endsWith("USDT")) return;
      const coin = d.s.slice(0, -4), px = +d.c;
      if (!(px > 0)) return;
      latest.set(coin, { px, t: Date.now() }); pending.set(coin, px);
      lastTick = Date.now();
    };
    sock.onclose = () => {
      if (ws !== sock || key !== myKey) return;
      ws = null;
      if (!opened) urlIdx++;                                   // 연결 자체가 안 되면 다른 주소로 시도
      retry++;
      const wait = Math.min(30000, 1000 * 2 ** Math.min(retry - 1, 5));
      setStatus("wait", `재연결 중… (${Math.round(wait / 1000)}초 뒤)`);
      retryTimer = setTimeout(open, wait);
    };
    sock.onerror = () => {};                                   // onclose 에서 처리
  }

  // 새 가격으로 한 코인의 거리·상태 다시 계산 (fib-core.js 의 규칙 그대로: 진입가는 고정, 롱/숏 공용)
  function applyPrice(r, px) { FibCore.applyPrice(r, px); }

  function applyLatest() {
    if (curLiveEx !== $("ex").value) return;
    for (const r of results) {
      const l = latest.get(r.market);
      if (!r.error && l && Date.now() - l.t < 60000) applyPrice(r, l.px);   // 1분 안에 받은 가격만
    }
  }

  function flash(el, dir) {
    if (!el || !dir) return;
    el.classList.remove("fu", "fd"); void el.offsetWidth; el.classList.add(dir > 0 ? "fu" : "fd");
  }

  // 0.3초마다 바뀐 코인만 화면에 반영 (표 전체를 다시 그리지 않음 → 펼친 차트도 유지)
  function flush() {
    if (!pending.size || curEx !== curLiveEx) { pending.clear(); return; }
    let changed = false;
    for (const [coin, px] of pending) {
      const r = results.find(x => x.market === coin && !x.error);
      if (!r) continue;
      const before = r.price, oldBadge = badge(r.current);
      applyPrice(r, px);
      if (px === before) continue;
      if (coin === openCoin && view === "lw") FiboChart.live(r, px, unitMs());   // 펼쳐 둔 차트의 마지막 캔들 실시간 갱신
      changed = true;
      const c = r.current, dir = px > before ? 1 : -1, newBadge = badge(c);
      const targets = [$("tbody").querySelector(`tr[data-m="${coin}"]`), $("cards").querySelector(`.ccard[data-m="${coin}"]`)];
      for (const el of targets) {
        if (!el) continue;
        const q = s => el.querySelector(s);
        q(".px").textContent = won(r.price); flash(q(".px"), dir);
        q(".lv").textContent = won(c?.level);
        const ds = q(".ds") || q(".dist");
        if (ds) {
          if (ds.classList.contains("dist")) { ds.textContent = c?.level ? `(${pct(c.distance)})` : ""; ds.classList.toggle("up", !!(c?.level && c.distance <= 5)); }
          else { ds.textContent = pct(c?.distance); ds.classList.toggle("up", !!(c?.level && c.distance < 0)); }
        }
        if (oldBadge !== newBadge) { q(".st").innerHTML = newBadge; flash(q(".st"), dir); }
        const xp = q(".xp"); if (xp) xp.textContent = won(c?.expected);
      }
    }
    pending.clear();
    if (changed) renderSummary();
  }
  setInterval(flush, 300);

  // 정렬은 3초에 한 번만: 순서가 실제로 바뀌었을 때만 표를 다시 그림
  setInterval(() => {
    if (!results.length || running || openCoin || curEx !== curLiveEx) return;   // 차트를 펼쳐 보는 중엔 줄이 안 움직이게
    if (sortedRows().map(r => r.market).join(",") !== shownOrder) renderTable();
  }, 3000);

  // 연결 상태 옆에 마지막 가격 수신 시각
  setInterval(() => {
    if (ws && ws.readyState === 1) {
      const ago = lastTick ? Math.round((Date.now() - lastTick) / 1000) : null;
      setStatus("on", ago == null ? "실시간 연결됨" : `실시간 연결됨 · ${ago <= 1 ? "방금" : ago + "초 전"} 수신`);
      if (lastTick && Date.now() - lastTick > 60000) { try { ws.close(); } catch (e) {} }   // 1분 넘게 조용하면 끊고 다시
    }
  }, 1000);

  // 화면을 다시 켰을 때 연결이 끊겨 있으면 바로 다시 연결
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && coins.length && (!ws || ws.readyState > 1)) { retry = 0; open(); }
  });

  return { connect, applyLatest };
})();

// ── 시작: 설정 불러오고 바로 분석 ─────────────────────────────────
loadSettings();
applyDirUI();
setMode(mode);
logosReady.then(() => { if (mode === "watch") renderChips(); });
setAuto();
run();
</script>
</body>
</html>
