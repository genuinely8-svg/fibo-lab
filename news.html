<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>주요뉴스 · ath TEST (참고용)</title>
<link rel="stylesheet" href="common.css">
<style>
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chips button{background:var(--bg);color:var(--muted);border:1px solid var(--line);padding:6px 12px;border-radius:99px;font-weight:600}
  .chips button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .item{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
  .item:last-child{border-bottom:0}
  .item img{width:120px;height:72px;object-fit:cover;border-radius:8px;flex:none;background:var(--bg)}
  .item .meta{font-size:12px;color:var(--muted);margin-bottom:4px}
  .item .src{display:inline-block;padding:1px 8px;border-radius:99px;font-weight:600;margin-right:6px;color:#fff}
  .item a.t{color:var(--text);text-decoration:none;font-weight:700;font-size:15px;line-height:1.45}
  .item a.t:hover{text-decoration:underline}
  .item p{margin:6px 0 0;color:var(--muted);line-height:1.6;font-size:13px}
  @media (max-width:600px){ .item img{width:84px;height:56px} }
  #kw{width:200px}
</style>
</head>
<body>
<div class="wrap">
  <h1>ath TEST (참고용)</h1>
  <p class="sub">여러 코인 매체의 최신 기사를 모아서 보여줘요. 제목을 누르면 원문이 새 창으로 열려요.</p>
  <nav id="nav"></nav>

  <div class="card">
    <div class="controls">
      <div class="chips" id="chips"></div>
      <label style="margin-left:auto">검색
        <input id="kw" placeholder="비트코인, ETF…">
      </label>
    </div>
    <div class="status" id="status"></div>
  </div>

  <div class="card" id="list"><div class="muted">불러오는 중…</div></div>

  <div class="foot">출처: 블록미디어 · 토큰포스트 · CoinDesk(영문) · 비트겟 공지 · 5분마다 새로 받아와요 · 기사 내용은 각 매체에 있어요.</div>
</div>

<script src="common.js"></script>
<script src="nav.js"></script>
<script>
const R2J = u => "https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(u);
const SOURCES = [
  { id: "blockmedia", name: "블록미디어", color: "#2563eb", kind: "rss", url: "https://www.blockmedia.co.kr/feed" },
  { id: "tokenpost",  name: "토큰포스트", color: "#7c3aed", kind: "rss", url: "https://www.tokenpost.kr/rss" },
  { id: "coindesk",   name: "CoinDesk",   color: "#0f766e", kind: "rss", url: "https://www.coindesk.com/arc/outboundfeeds/rss/" },
  { id: "bitget",     name: "비트겟 공지", color: "#0ea5b7", kind: "bitget" },
];
let items = [], filter = "all";
const failed = [];

const text = html => new DOMParser().parseFromString(html || "", "text/html").body.textContent.replace(/\s+/g, " ").trim();
const safeUrl = u => /^https?:\/\//i.test(u || "") ? u : null;

async function loadSource(s) {
  return cached("news-" + s.id, 5 * 60e3, async () => {
    if (s.kind === "bitget") {
      const j = await getJSON("https://api.bitget.com/api/v2/public/annoucements?language=ko_KR");
      return (j.data || []).map(a => ({ src: s.id, title: a.annTitle, link: a.annUrl, t: +a.cTime, desc: "", img: null }));
    }
    const j = await getJSON(R2J(s.url));
    if (j.status !== "ok") throw new Error("피드를 못 읽었어요");
    return (j.items || []).map(it => ({
      src: s.id, title: text(it.title), link: it.link,
      t: Date.parse((it.pubDate || "").replace(" ", "T") + "Z") || 0,     // rss2json 시간은 UTC
      desc: text(it.description).slice(0, 160),
      img: it.thumbnail || it.enclosure?.link || null,
    }));
  });
}

async function load() {
  $("status").textContent = "불러오는 중…";
  failed.length = 0;
  const res = await Promise.all(SOURCES.map(s => loadSource(s).catch(e => { failed.push(s.name); return []; })));
  items = res.flat().filter(x => x.title && safeUrl(x.link)).sort((a, b) => b.t - a.t);
  render();
  $("status").textContent = `기사 ${items.length}개 · ${new Date().toLocaleTimeString("ko-KR")}` + (failed.length ? ` · 불러오지 못한 곳: ${failed.join(", ")}` : "");
}

function render() {
  $("chips").innerHTML = [["all", "전체"], ...SOURCES.map(s => [s.id, s.name])]
    .map(([id, name]) => `<button data-id="${id}" class="${id === filter ? "on" : ""}">${name}</button>`).join("");
  for (const b of $("chips").querySelectorAll("button")) b.onclick = () => { filter = b.dataset.id; render(); };
  const kw = $("kw").value.trim().toLowerCase();
  const shown = items.filter(x => (filter === "all" || x.src === filter) && (!kw || (x.title + " " + x.desc).toLowerCase().includes(kw)));
  $("list").innerHTML = shown.map(x => {
    const s = SOURCES.find(y => y.id === x.src);
    const img = safeUrl(x.img);
    return `<div class="item">
      ${img ? `<img src="${esc(img)}" alt="" loading="lazy" onerror="this.remove()">` : ""}
      <div>
        <div class="meta"><span class="src" style="background:${s.color}">${s.name}</span>${x.t ? ago(x.t) + " · " + new Date(x.t).toLocaleString("ko-KR", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }) : ""}</div>
        <a class="t" href="${esc(x.link)}" target="_blank" rel="noopener noreferrer">${esc(x.title)}</a>
        ${x.desc ? `<p>${esc(x.desc)}${x.desc.length >= 160 ? "…" : ""}</p>` : ""}
      </div>
    </div>`;
  }).join("") || `<div class="muted">기사가 없어요</div>`;
}

$("kw").oninput = render;
load();
setInterval(() => { if (!document.hidden) load(); }, 5 * 60e3);
</script>
</body>
</html>
